<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight Project</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <h1>⚔️ Fight Arena</h1>
        </header>

        <section class="character-select" id="characterSelect">
            <p class="select-title">Escolha seu personagem</p>
            <div class="select-options">
                <button class="select-card" data-character="knight">
                    <div class="avatar">🛡️</div>
                    <strong>Cavaleiro</strong>
                    <span>Resistente e equilibrado</span>
                </button>
                <button class="select-card" data-character="sorcerer">
                    <div class="avatar">🧙</div>
                    <strong>Feiticeiro</strong>
                    <span>Ofensivo, porém frágil</span>
                </button>
            </div>
            <p class="select-hint">Os atributos de cada lutador (e o monstro sorteado) mudam a cada partida — a força de cada um é sempre uma surpresa.</p>
        </section>

        <div class="fightarea" id="fightarea" hidden>
            <section class="fighter-card" id="char">
                <div class="avatar">---</div>
                <strong class="name">---</strong>
                <div class="lifebar">
                    <div class="bar"></div>
                </div>
                <div class="actions">
                    <button class="attackButton">Atacar</button>
                    <button class="defendButton">Defender</button>
                </div>
            </section>

            <div class="vs">VS</div>

            <section class="fighter-card" id="monster">
                <div class="avatar">---</div>
                <strong class="name">---</strong>
                <div class="lifebar">
                    <div class="bar"></div>
                </div>
            </section>
        </div>

        <ul class="log" id="log" hidden></ul>
    </div>

    <div class="overlay" id="gameOverOverlay" hidden>
        <div class="overlay-content">
            <h2 id="gameOverText"></h2>
            <button id="restartButton">Jogar novamente</button>
        </div>
    </div>

<script src="./assets/js/classes.js"></script>
<script src="./assets/js/script.js"></script>
</body>
</html>
